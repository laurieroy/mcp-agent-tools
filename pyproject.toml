[project]
name = "mcp-agent-tools"
version = "0.1.0"
description = "MCP tool-augmented ops assistant: FastMCP-style server, stdio client, agent loop, Streamlit console"
readme = "README.md"
authors = [
    { name = "Laurie Roy", email = "laurieroy.dev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=0.39.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "openai>=3.59.0",
    "pydantic>=2.14.4",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
